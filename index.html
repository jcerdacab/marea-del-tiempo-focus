<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Marea del tiempo — Focus</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="libraries/p5.min.js"></script>
    <script defer src="timer.js"></script>
    <script defer src="app.js"></script>
    <script defer src="sketch.js"></script>
  </head>

  <body>
    <main>
      <header>
        <p class="eyebrow">UN ESPACIO PARA TI</p>
        <h1>Marea del tiempo</h1>
        <p class="subtitle">Un momento para concentrarte</p>
      </header>

      <div
        id="visual"
        role="img"
        aria-label="Un astro y una marea animada que sube con el progreso de la sesión"
      ></div>

      <section aria-label="Temporizador">
        <fieldset>
          <legend>Elige tu momento</legend>
          <div class="modes">
            <label>
              <input type="radio" name="mode" value="focus" checked>
              <span>Concentración</span>
            </label>
            <label>
              <input type="radio" name="mode" value="break">
              <span>Descanso</span>
            </label>
          </div>
        </fieldset>

        <div class="timer">
          <p id="status" role="status">Preparado</p>
          <output
            id="remaining"
            aria-label="Tiempo restante"
            aria-live="off"
          >25:00</output>
          <p class="timer-label">TIEMPO RESTANTE</p>
        </div>

        <div class="duration">
          <label for="duration">Duración</label>
          <select id="duration"></select>
        </div>

        <div class="buttons">
          <button id="start" class="primary" type="button">Iniciar</button>
          <button id="pause" type="button">Pausar</button>
          <button id="reset" type="button">Reiniciar</button>
        </div>

        <p id="message" class="message" role="status"></p>
      </section>
    </main>
  </body>
</html>
